[tool.poetry]
name = "xarray-selafin"
version = "0.2.5"
description = ""
authors = ["tomsail <saillour.thomas@gmail.com>", "lucduron <l.duron@cnr.tm.fr>"]
readme = "README.md"
repository = "https://github.com/oceanmodeling/xarray-selafin/"
include = [
    "xarray_selafin/data/*",
    "xarray_selafin/variable/*"
]

[tool.poetry.dependencies]
python = ">=3.11"
numpy = "*"
xarray = "*"
python-serafin = ">=0.2,<0.3"

[tool.poetry.plugins."xarray.backends"]
selafin = "xarray_selafin.xarray_backend:SelafinBackendEntrypoint"

[tool.poetry.group.dev.dependencies]
certifi = ">=2026.10.19"
urllib3 = ">=2.8.0"
pytest = "*"
pillow = ">=13.0.0"  # pin transitive dep above all open CVEs (Dependabot)
scipy = "*"
xarray = {version = "*",  extras = ["io"]}
dask = "*"
zensical = "*"
hvplot = "*"
jupyter-bokeh = "*"
mkdocs-material = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']
line-length = 107

[tool.ruff.isort]
force-single-line = true
